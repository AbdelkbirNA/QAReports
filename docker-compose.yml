services:

  api-tests:
    build:
      context: .
      dockerfile: Dockerfile
    user: root
    working_dir: /tests
    volumes:
      - .:/tests
      - ./results:/results
    command: >
      robot
      --listener allure_robotframework:/results/allure-results-api
      --outputdir /results/api
      api_tests

  ui-tests:
    build:
      context: .
      dockerfile: Dockerfile
    user: root
    working_dir: /tests
    volumes:
      - .:/tests
      - ./results:/results
    command: >
      robot
      --listener allure_robotframework:/results/allure-results-ui
      --outputdir /results/ui
      ui_tests
