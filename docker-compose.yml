services:
  api-tests:
    image: ppodgorsek/robot-framework:latest
    user: root
    working_dir: /opt/robotframework/tests
    volumes:
      - .:/opt/robotframework/tests
      - ./results:/opt/robotframework/reports
    command:
      - sh
      - -c
      - |
        pip install --quiet allure-robotframework
        mkdir -p /opt/robotframework/reports/allure-results /opt/robotframework/reports/api
        robot --listener allure_robotframework:/opt/robotframework/reports/allure-results --outputdir /opt/robotframework/reports/api api_tests/tests

  ui-tests:
    image: ppodgorsek/robot-framework:latest
    user: root
    working_dir: /opt/robotframework/tests
    volumes:
      - .:/opt/robotframework/tests
      - ./results:/opt/robotframework/reports
    command:
      - sh
      - -c
      - |
        pip install --quiet allure-robotframework
        mkdir -p /opt/robotframework/reports/allure-results /opt/robotframework/reports/ui
        robot --listener allure_robotframework:/opt/robotframework/reports/allure-results --outputdir /opt/robotframework/reports/ui ui_tests/tests

  allure-generate:
    build:
      context: .
      dockerfile: Dockerfile.allure
    working_dir: /opt/robotframework/reports
    volumes:
      - ./results:/opt/robotframework/reports
    depends_on:
      api-tests:
        condition: service_started
      ui-tests:
        condition: service_started
    command: >
      sh -c "sleep 30 && allure generate allure-results -o allure-report --clean"

  allure-report-server:
    image: nginx:1.27-alpine
    ports:
      - "9080:80"
    volumes:
      - ./results/allure-report:/usr/share/nginx/html:ro
    depends_on:
      allure-generate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 3
